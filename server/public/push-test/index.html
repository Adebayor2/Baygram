<!doctype html>
<html>
  <body>
    <h1>BayGram Push Test</h1>
    <input id="token" type="password" placeholder="Bearer token" />
    <button id="subscribe">Subscribe</button>
    <pre id="status"></pre>
    <script>
      const status = document.getElementById("status");
      document.getElementById("subscribe").onclick = async () => {
        try {
          const permission = await Notification.requestPermission();
          if (permission !== "granted") throw new Error("Notification permission denied");
          const registration = await navigator.serviceWorker.register("./sw.js");
          await navigator.serviceWorker.ready;
          const keyResponse = await fetch("http://localhost:4000/graphql", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ query: "{ vapidPublicKey }" })
          });
          const keyData = await keyResponse.json();
          const publicKey = keyData.data.vapidPublicKey;
          function urlBase64ToUint8Array(base64) {
            const padding = "=".repeat((4 - base64.length % 4) % 4);
            const base64Text = (base64 + padding).replace(/-/g, "+").replace(/_/g, "/");
            const raw = atob(base64Text);
            return Uint8Array.from([...raw].map((char) => char.charCodeAt(0)));
          }
          const subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(publicKey)
          });
          const json = subscription.toJSON();
          await fetch("http://localhost:4000/graphql", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              authorization: "Bearer " + document.getElementById("token").value.trim()
            },
            body: JSON.stringify({
              query: "mutation Register($input: PushSubscriptionInput!) { registerPushSubscription(input: $input) }",
              variables: {
                input: {
                  endpoint: json.endpoint,
                  p256dh: json.keys.p256dh,
                  auth: json.keys.auth,
                  userAgent: navigator.userAgent
                }
              }
            })
          });
          status.textContent = "Subscribed";
        } catch (error) {
          status.textContent = error.message;
        }
      };
    </script>
  </body>
</html>
